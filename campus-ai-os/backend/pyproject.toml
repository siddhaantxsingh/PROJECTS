[project]
name = "campus-ai-os"
version = "0.1.0"
description = "Multi-tenant course knowledge platform: grounded Q&A with citations, study tools, privacy-preserving analytics"
requires-python = ">=3.11"
dependencies = ["groundwork", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["campus*"]

# Not executed in the build sandbox (Docker Hub blocked); see docs/deployment.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: groundwork }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s }
  redis:
    image: redis:7
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      GW_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/groundwork"
      GW_REDIS_URL: redis://redis:6379/0
      GW_API_KEYS: "${GW_API_KEYS:?set GW_API_KEYS}"
    ports: ["8080:8080"]
    read_only: true
volumes: { pgdata: {} }

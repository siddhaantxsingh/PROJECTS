[project]
name = "groundwork"
version = "0.1.0"
description = "Retrieval and grounded-generation engine with a reproducible evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "psycopg[binary]>=3.1", "pgvector>=0.2",
  "redis>=5", "numpy>=1.26", "scipy>=1.11", "pypdf>=4", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groundwork*"]

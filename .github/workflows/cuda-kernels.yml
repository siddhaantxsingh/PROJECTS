name: cuda-kernels
on:
  push:
    paths: ["cuda-kernels/**", ".github/workflows/cuda-kernels.yml"]
  pull_request:
    paths: ["cuda-kernels/**", ".github/workflows/cuda-kernels.yml"]
jobs:
  emulator:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: cuda-kernels }
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make analyze > /dev/null
  device:
    # compiles the kernels as real CUDA (no GPU on the runner: nothing is executed)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: cuda-kernels }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y g++-13 && clang++ --version
      - run: tools/fetch_cuda.sh
      - run: make ptx
      - name: no stack frames or spills
        run: "! grep -E ' [1-9][0-9]* bytes (stack frame|spill)' build/device/ptxas_*.txt"
      - name: tensor-core kernels contain HMMA on sm_80, sm_89, sm_90 (make ptx fails otherwise)
        run: grep -c HMMA build/device/sass_sm_89.txt
      - run: make gpu-bench CUDA_ARCH=sm_80
      - run: make gpu-bench CUDA_ARCH=sm_89
      - run: bash -n tools/owner_rtx4060.sh

name: campus-ai-os
on:
  push:
    paths: ["campus-ai-os/**", "groundwork/**", ".github/workflows/campus-ai-os.yml"]
  pull_request:
    paths: ["campus-ai-os/**", "groundwork/**", ".github/workflows/campus-ai-os.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: campus-ai-os }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # groundwork is a sibling directory in this monorepo
      - run: pip install -e ../groundwork -e 'backend[dev]'
      - run: cd backend && pytest
      - run: cd frontend && npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cd frontend && CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npx playwright test

name: riscv-cpu
on:
  push:
    paths: ["riscv-cpu/**", ".github/workflows/riscv-cpu.yml"]
  pull_request:
    paths: ["riscv-cpu/**", ".github/workflows/riscv-cpu.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: riscv-cpu }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf yosys
      - run: make fetch
      - run: make lint
      - run: make -j4 sim
      - run: make test-isa
      - run: make -j4 test-random RAND_N=150 RAND_SEED=${{ github.run_number }}
      - run: make test-irq
      - run: make test-variants
      - run: make bench
      - run: make synth
  spike:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: riscv-cpu }
    env:
      SPIKE_REV: f8a060b7bea8da6f738f193ed1b66b665978d092
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator gcc-riscv64-unknown-elf device-tree-compiler libboost-regex-dev libboost-system-dev
      - uses: actions/cache@v4
        id: spike
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_REV }}
      - if: steps.spike.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim spike-src
          git -C spike-src checkout $SPIKE_REV
          mkdir spike-build && cd spike-build
          ../spike-src/configure --prefix=$HOME/spike && make -j4 && make install
      - run: make fetch
      - run: make -j4 test-spike SPIKE=$HOME/spike/bin/spike RAND_N=100 RAND_SEED=${{ github.run_number }}

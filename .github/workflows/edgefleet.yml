name: edgefleet
on:
  push:
    paths: ["edgefleet/**", ".github/workflows/edgefleet.yml"]
  pull_request:
    paths: ["edgefleet/**", ".github/workflows/edgefleet.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: edgefleet }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./internal/...
      - run: go test -count=2 ./e2e/
      - run: go run ./cmd/fleetsim -n 300 -heartbeat 500ms

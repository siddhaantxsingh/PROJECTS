name: inferx
on:
  push:
    paths: ["inferx/**", ".github/workflows/inferx.yml"]
  pull_request:
    paths: ["inferx/**", ".github/workflows/inferx.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: inferx }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

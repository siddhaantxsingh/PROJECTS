server:
  port: 8095
spring:
  datasource:
    url: jdbc:h2:file:./data/evalops;AUTO_SERVER=FALSE
  sql:
    init:
      mode: always
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
evalops:
  request-timeout: 60s
  max-attempts: 3
  bootstrap-resamples: 2000
